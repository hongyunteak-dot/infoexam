<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>온라인 PDF 문제 풀이 시스템</title>
    <style>
        body { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; background-color: #f4f7f6; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #2c3e50; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        h1 { margin: 0; font-size: 1.5em; }
        
        .select-box { background: white; padding: 8px 15px; border-radius: 5px; border: none; font-size: 1em; font-weight: bold; cursor: pointer; outline: none; }
        
        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        /* 왼쪽 PDF 영역 */
        .pdf-section { flex: 6; display: flex; flex-direction: column; border-right: 2px solid #ddd; background: #525659; }
        .pdf-controls { background: #34495e; padding: 10px; text-align: center; display: none; gap: 10px; justify-content: center; }
        .pdf-btn { padding: 8px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1em; }
        .btn-q { background: #3498db; color: white; }
        .btn-a { background: #27ae60; color: white; }
        .pdf-section iframe { width: 100%; height: 100%; border: none; flex: 1; }
        
        /* 오른쪽 OMR 영역 */
        .omr-section { flex: 4; padding: 20px; overflow-y: auto; background: white; }
        h2 { border-bottom: 2px solid #3498db; padding-bottom: 10px; color: #2c3e50; margin-top: 0; }
        
        .omr-row { display: flex; align-items: center; margin-bottom: 15px; padding: 10px; background: #f9f9f9; border-radius: 5px; }
        .q-num { font-weight: bold; width: 45px; color: #3498db; }
        .options { display: flex; gap: 10px; }
        .options label { display: inline-block; width: 35px; height: 35px; line-height: 35px; text-align: center; border: 1px solid #ccc; border-radius: 50%; cursor: pointer; background: white; transition: 0.2s; font-weight: bold; }
        .options input[type="radio"] { display: none; }
        .options input[type="radio"]:checked + label { background: #3498db; color: white; border-color: #3498db; }
        
        .result-text { font-size: 0.9em; margin-left: 15px; display: none; }
        .correct-text { color: #27ae60; font-weight: bold; }
        .wrong-text { color: #e74c3c; font-weight: bold; }
        
        .submit-btn { background-color: #e74c3c; color: white; border: none; padding: 15px; font-size: 1.1em; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 20px; font-weight: bold; }
        .submit-btn:hover { background-color: #c0392b; }
        
        #historyContainer { margin-top: 30px; border-top: 2px dashed #ddd; padding-top: 20px; }
        .history-item { background: #ecf0f1; padding: 10px; margin-bottom: 8px; border-radius: 4px; font-size: 0.9em; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; overflow: auto; }
            .pdf-section { height: 50vh; flex: none; }
            .omr-section { height: auto; flex: none; }
        }
    </style>
</head>
<body>

    <header>
        <h1>📝 <span id="headerTitle">온라인 모의고사</span></h1>
        <select id="testSelector" class="select-box" onchange="changeTest()">
            <option value="">시험지를 불러오는 중...</option>
        </select>
    </header>

    <div class="main-container">
        <!-- PDF 뷰어 영역 -->
        <div class="pdf-section">
            <div id="pdfControls" class="pdf-controls">
                <button class="pdf-btn btn-q" onclick="viewPDF('question')">📄 문제지 보기</button>
                <button class="pdf-btn btn-a" onclick="viewPDF('answer')">📝 해설지 보기</button>
            </div>
            <iframe id="pdfViewer" src="" title="PDF 뷰어"></iframe>
        </div>

        <!-- OMR 답안지 영역 -->
        <div class="omr-section">
            <h2>답안 입력 (OMR)</h2>
            <div id="omrArea"></div>
            <button id="submitBtn" class="submit-btn" onclick="gradeQuiz()" style="display:none;">✅ 채점하고 해설지 열기</button>

            <div id="historyContainer" style="display:none;">
                <h2>📊 내 채점 기록</h2>
                <div id="historyArea"></div>
            </div>
        </div>
    </div>

    <script>
        let currentQuizData = null;
        let currentPdfFiles = { question: '', answer: '' };

        window.onload = function() {
            fetch('list.json')
                .then(res => res.json())
                .then(list => {
                    const selector = document.getElementById('testSelector');
                    selector.innerHTML = ''; 
                    
                    list.forEach(test => {
                        const option = document.createElement('option');
                        option.value = JSON.stringify(test);
                        option.text = test.name;
                        selector.appendChild(option);
                    });

                    if (list.length > 0) loadTest(list[0]);
                    loadHistory();
                })
                .catch(err => {
                    document.getElementById('omrArea').innerHTML = '<p style="color:red;">목록 파일(list.json)을 불러오지 못했습니다.</p>';
                });
        };

        function changeTest() {
            const selector = document.getElementById('testSelector');
            const selectedTest = JSON.parse(selector.value);
            loadTest(selectedTest);
        }

        function loadTest(testInfo) {
            // PDF 파일 경로 저장 및 문제지 초기 화면 설정
            currentPdfFiles.question = testInfo.pdf;
            currentPdfFiles.answer = testInfo.answerPdf;
            viewPDF('question');
            document.getElementById('pdfControls').style.display = 'none'; // 초기엔 버튼 숨김
            
            // 정답지(JSON) 불러오기
            fetch(testInfo.answerData)
                .then(res => res.json())
                .then(data => {
                    currentQuizData = data;
                    document.getElementById('headerTitle').innerText = data.title;
                    renderOMR();
                    document.getElementById('submitBtn').style.display = 'block'; 
                })
                .catch(err => {
                    document.getElementById('omrArea').innerHTML = `<p style="color:red;">채점 데이터를 불러오지 못했습니다.</p>`;
                    document.getElementById('submitBtn').style.display = 'none';
                });
        }

        // PDF 전환 함수 (문제지 <-> 해설지)
        function viewPDF(type) {
            const viewer = document.getElementById('pdfViewer');
            if (type === 'question') {
                viewer.src = currentPdfFiles.question;
            } else if (type === 'answer') {
                viewer.src = currentPdfFiles.answer;
            }
        }

        function renderOMR() {
            const omrArea = document.getElementById('omrArea');
            omrArea.innerHTML = '';

            for (let i = 0; i < currentQuizData.totalQuestions; i++) {
                let optionsHTML = '';
                for (let j = 1; j <= 4; j++) { // 기본 4지선다
                    optionsHTML += `
                        <input type="radio" id="q${i}_opt${j}" name="question${i}" value="${j}">
                        <label for="q${i}_opt${j}">${j}</label>
                    `;
                }

                omrArea.innerHTML += `
                    <div class="omr-row">
                        <div class="q-num">${i + 1}번</div>
                        <div class="options">${optionsHTML}</div>
                        <div class="result-text" id="result-${i}"></div>
                    </div>
                `;
            }
        }

        function gradeQuiz() {
            if (!currentQuizData) return;
            
            const total = currentQuizData.totalQuestions;
            let answered = 0;
            for (let i = 0; i < total; i++) {
                if(document.querySelector(`input[name="question${i}"]:checked`)) answered++;
            }
            if (answered < total) {
                if(!confirm(`아직 풀지 않은 문제가 ${total - answered}개 있습니다. 이대로 채점하시겠습니까?`)) return;
            }

            let score = 0;

            for (let i = 0; i < total; i++) {
                const selected = document.querySelector(`input[name="question${i}"]:checked`);
                const resultText = document.getElementById(`result-${i}`);
                const correctAnswer = currentQuizData.answers[i];

                resultText.style.display = 'block';

                if (selected && parseInt(selected.value) === correctAnswer) {
                    score++;
                    resultText.innerHTML = '<span class="correct-text">⭕ 정답</span>';
                } else {
                    const submitAnswer = selected ? selected.value + "번" : "미입력";
                    resultText.innerHTML = `<span class="wrong-text">❌ 오답 (정답: ${correctAnswer}번)</span>`;
                }
            }

            const finalScore = Math.round((score / total) * 100);
            saveHistory(currentQuizData.title, score, total, finalScore);
            alert(`채점 완료! 해설지 PDF를 확인하세요.\n${total}문제 중 ${score}문제 정답 (${finalScore}점)`);
            
            // 채점 완료 시 처리
            document.getElementById('submitBtn').style.display = 'none'; // 채점 버튼 숨김
            document.getElementById('pdfControls').style.display = 'flex'; // 문제지/해설지 전환 버튼 표시
            viewPDF('answer'); // 자동으로 해설지 PDF로 화면 전환
        }

        function saveHistory(testTitle, score, total, finalScore) {
            const history = JSON.parse(localStorage.getItem('pdfQuizHistory')) || [];
            const now = new Date();
            const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            history.unshift({ testTitle: testTitle, date: dateStr, score: score, total: total, finalScore: finalScore });
            localStorage.setItem('pdfQuizHistory', JSON.stringify(history));
            loadHistory();
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('pdfQuizHistory')) || [];
            if (history.length > 0) {
                document.getElementById('historyContainer').style.display = 'block';
                const historyArea = document.getElementById('historyArea');
                historyArea.innerHTML = '';
                
                history.slice(0, 5).forEach(record => {
                    historyArea.innerHTML += `
                        <div class="history-item">
                            <strong style="color:#2980b9;">[${record.testTitle}]</strong><br>
                            🗓️ ${record.date} - <strong>${record.finalScore}점</strong> (${record.total}문항 중 ${record.score}정답)
                        </div>
                    `;
                });
            }
        }
    </script>
</body>
</html>
