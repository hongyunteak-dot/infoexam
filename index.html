<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>온라인 PDF 모의고사</title>
    <style>
        body { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; background-color: #f4f7f6; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #2c3e50; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        h1 { margin: 0; font-size: 1.5em; }
        .select-box { background: white; padding: 8px 15px; border-radius: 5px; border: none; font-size: 1em; font-weight: bold; cursor: pointer; outline: none; }
        
        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        /* 왼쪽 문제지 PDF 영역 */
        .pdf-section { flex: 6; border-right: 2px solid #ddd; background: #525659; }
        .pdf-section iframe { width: 100%; height: 100%; border: none; }
        
        /* 오른쪽 OMR 및 해설 영역 */
        .omr-section { flex: 4; padding: 20px; overflow-y: auto; background: white; }
        h2 { border-bottom: 2px solid #3498db; padding-bottom: 10px; color: #2c3e50; margin-top: 0; }
        
        /* 이름 입력 칸 */
        #nameContainer { margin-bottom: 15px; padding: 15px; background: #eaf2f8; border-radius: 5px; font-weight: bold; color: #2c3e50; display: flex; align-items: center; }
        #studentName { padding: 8px; border: 1px solid #bdc3c7; border-radius: 4px; font-size: 1em; margin-left: 10px; flex: 1; outline: none; }
        #studentName:focus { border-color: #3498db; }

        .omr-row { display: flex; align-items: center; margin-bottom: 5px; padding: 10px; background: #f9f9f9; border-radius: 5px; }
        .q-num { font-weight: bold; width: 45px; color: #3498db; }
        .options { display: flex; gap: 10px; flex: 1; flex-wrap: wrap; align-items: center; }
        .options label { display: inline-block; width: 35px; height: 35px; line-height: 35px; text-align: center; border: 1px solid #ccc; border-radius: 50%; cursor: pointer; background: white; transition: 0.2s; font-weight: bold; }
        .options input[type="radio"] { display: none; }
        .options input[type="radio"]:checked + label { background: #3498db; color: white; border-color: #3498db; }
        
        /* 서술형 입력 폼 디자인 */
        .subjective-input { width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 4px; font-family: inherit; font-size: 0.95em; resize: vertical; box-sizing: border-box; outline: none; transition: 0.2s; }
        .subjective-input:focus { border-color: #3498db; background-color: #fdfefe; }

        .result-text { font-size: 0.9em; margin-left: 15px; display: none; white-space: nowrap; }
        .correct-text { color: #27ae60; font-weight: bold; }
        .wrong-text { color: #e74c3c; font-weight: bold; }
        
        .explanation-text { display: none; margin: 0 0 15px 0; padding: 12px; background: #e8f8f5; border-left: 4px solid #1abc9c; font-size: 0.95em; border-radius: 4px; color: #333; line-height: 1.5; }
        
        .submit-btn { background-color: #e74c3c; color: white; border: none; padding: 15px; font-size: 1.1em; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
        .submit-btn:hover { background-color: #c0392b; }
        
        #historyContainer { margin-top: 30px; border-top: 2px dashed #ddd; padding-top: 20px; }
        .history-item { background: #ecf0f1; padding: 10px; margin-bottom: 8px; border-radius: 4px; font-size: 0.9em; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; overflow: auto; }
            .pdf-section { height: 50vh; flex: none; }
            .omr-section { height: auto; flex: none; }
        }
    </style>
</head>
<body>

    <header>
        <h1>📝 <span id="headerTitle">온라인 모의고사</span></h1>
        <select id="testSelector" class="select-box" onchange="changeTest()">
            <option value="">시험지를 불러오는 중...</option>
        </select>
    </header>

    <div class="main-container">
        <!-- PDF 뷰어 -->
        <div class="pdf-section">
            <iframe id="pdfViewer" src="" title="문제지 PDF"></iframe>
        </div>

        <!-- OMR 답안지 및 해설 -->
        <div class="omr-section">
            <h2>답안 입력</h2>
            
            <div id="nameContainer" style="display:none;">
                👤 이름: <input type="text" id="studentName" placeholder="학번과 이름을 입력하세요 (예: 10101 홍길동)">
            </div>

            <div id="omrArea"></div>
            <button id="submitBtn" class="submit-btn" onclick="gradeQuiz()" style="display:none;">✅ 채점하고 정답·해설 보기</button>

            <div id="historyContainer" style="display:none;">
                <h2>📊 채점 기록 (캡처용)</h2>
                <div id="historyArea"></div>
            </div>
        </div>
    </div>

    <script>
        let currentQuizData = null;
        let currentTestInfo = null; // 현재 선택된 출판사 정보를 저장할 변수 추가

        window.onload = function() {
            fetch('list.json')
                .then(res => res.json())
                .then(data => {
                    const selector = document.getElementById('testSelector');
                    selector.innerHTML = ''; 
                    
                    let firstTest = null;

                    data.forEach(group => {
                        const optgroup = document.createElement('optgroup');
                        optgroup.label = group.publisher; 

                        group.tests.forEach(test => {
                            // 핵심 포인트: test 데이터 안에 출판사 이름(publisher)을 몰래 끼워넣습니다.
                            test.publisher = group.publisher; 
                            
                            const option = document.createElement('option');
                            option.value = JSON.stringify(test);
                            option.text = test.name;
                            optgroup.appendChild(option);
                            
                            if (!firstTest) firstTest = test; 
                        });
                        selector.appendChild(optgroup);
                    });

                    if (firstTest) loadTest(firstTest);
                    loadHistory();
                })
                .catch(err => {
                    document.getElementById('omrArea').innerHTML = '<p style="color:red;">목록 파일(list.json)을 불러오지 못했습니다. 파일 구조를 확인해주세요.</p>';
                });
        };

        function changeTest() {
            const selector = document.getElementById('testSelector');
            const selectedTest = JSON.parse(selector.value);
            loadTest(selectedTest);
        }

        function loadTest(testInfo) {
            currentTestInfo = testInfo; // 현재 출판사 정보 저장
            document.getElementById('pdfViewer').src = testInfo.pdf;
            
            fetch(testInfo.answerData)
                .then(res => res.json())
                .then(data => {
                    currentQuizData = data;
                    // 제목 상단에 출판사 이름도 같이 표시
                    document.getElementById('headerTitle').innerText = `[${testInfo.publisher}] ${data.title}`;
                    document.getElementById('nameContainer').style.display = 'flex'; 
                    renderOMR();
                    document.getElementById('submitBtn').style.display = 'block'; 
                })
                .catch(err => {
                    document.getElementById('omrArea').innerHTML = `<p style="color:red;">채점 데이터(${testInfo.answerData})를 불러오지 못했습니다.</p>`;
                    document.getElementById('submitBtn').style.display = 'none';
                    document.getElementById('nameContainer').style.display = 'none';
                });
        }

        function renderOMR() {
            const omrArea = document.getElementById('omrArea');
            omrArea.innerHTML = '';

            for (let i = 0; i < currentQuizData.totalQuestions; i++) {
                let optionsHTML = '';
                
                if (currentQuizData.answers[i] === 0) {
                    optionsHTML = `<textarea id="q${i}_text" class="subjective-input" rows="2" placeholder="주관식/서술형 정답을 자유롭게 입력하세요"></textarea>`;
                } else {
                    for (let j = 1; j <= 5; j++) { 
                        optionsHTML += `
                            <input type="radio" id="q${i}_opt${j}" name="question${i}" value="${j}">
                            <label for="q${i}_opt${j}">${j}</label>
                        `;
                    }
                }

                omrArea.innerHTML += `
                    <div class="omr-row">
                        <div class="q-num">${i + 1}번</div>
                        <div class="options">${optionsHTML}</div>
                        <div class="result-text" id="result-${i}"></div>
                    </div>
                    <div class="explanation-text" id="exp-${i}">
                        <strong>💡 해설:</strong> ${currentQuizData.explanations[i] || '해설이 제공되지 않았습니다.'}
                    </div>
                `;
            }
        }

        function gradeQuiz() {
            if (!currentQuizData) return;
            
            const studentName = document.getElementById('studentName').value.trim();
            if (!studentName) {
                alert('채점하기 전에 학번과 이름을 먼저 입력해 주세요!');
                document.getElementById('studentName').focus();
                return;
            }

            const total = currentQuizData.totalQuestions;
            let answered = 0;
            
            for (let i = 0; i < total; i++) {
                if (currentQuizData.answers[i] === 0) {
                    if (document.getElementById(`q${i}_text`).value.trim() !== '') answered++;
                } else {
                    if (document.querySelector(`input[name="question${i}"]:checked`)) answered++;
                }
            }
            
            if (answered < total) {
                if(!confirm(`아직 풀지 않은 문제가 ${total - answered}개 있습니다. 이대로 채점하시겠습니까?`)) return;
            }

            let score = 0;
            let autoTotal = total; 

            for (let i = 0; i < total; i++) {
                const resultText = document.getElementById(`result-${i}`);
                const expText = document.getElementById(`exp-${i}`);
                const correctAnswer = currentQuizData.answers[i];

                if (expText) expText.style.display = 'block'; 
                resultText.style.display = 'block';

                if (correctAnswer === 0) {
                    autoTotal--;
                    const textArea = document.getElementById(`q${i}_text`);
                    textArea.readOnly = true;
                    textArea.style.backgroundColor = "#f0f3f4";
                    textArea.style.color = "#7f8c8d";
                    resultText.innerHTML = '<span style="color:#f39c12; font-weight:bold;">⚠️ 자가 채점</span>';
                } else {
                    const selected = document.querySelector(`input[name="question${i}"]:checked`);
                    if (selected && parseInt(selected.value) === correctAnswer) {
                        score++;
                        resultText.innerHTML = '<span class="correct-text">⭕ 정답</span>';
                    } else {
                        const submitAnswer = selected ? selected.value + "번" : "미입력";
                        resultText.innerHTML = `<span class="wrong-text">❌ 오답 (정답: ${correctAnswer}번)</span>`;
                    }
                }
            }

            const finalScore = autoTotal > 0 ? Math.round((score / autoTotal) * 100) : 0;
            
            // 전송용 풀네임 생성: 예) "[📘 씨마스 문제] 1. 컴퓨팅 시스템 (1회)"
            const fullTestTitle = `[${currentTestInfo.publisher}] ${currentQuizData.title}`;

            saveHistory(studentName, fullTestTitle, score, autoTotal, finalScore);
            
            // 📌 구글 스프레드시트 전송 로직
            const scriptURL = 'https://script.google.com/macros/s/AKfycby5n7DxgNghVV6myBlC7tono4Q-A441vZsz_b9SaztY6dEy-qLavnBT1nPDgGrOy-yk/exec'; 
            if (scriptURL && scriptURL.startsWith('http')) {
                const scoreText = `객관식 ${autoTotal}문항 중 ${score}정답 (${finalScore}점)`;
                
                // fullTestTitle을 전송하여 시트에 출판사가 포함되도록 합니다.
                fetch(`${scriptURL}?name=${encodeURIComponent(studentName)}&testTitle=${encodeURIComponent(fullTestTitle)}&scoreText=${encodeURIComponent(scoreText)}`, { mode: 'no-cors' })
                    .catch(error => console.error('전송 실패!', error.message));
            }

            alert(`[${studentName}] 학생의 객관식 채점이 완료되었습니다!\n(자동 채점 대상 ${autoTotal}문제 중 ${score}문제 정답)\n\n서술형 문제와 틀린 문제는 화면 아래의 해설을 보며 스스로 확인해 보세요.`);
            
            document.getElementById('submitBtn').style.display = 'none'; 
            document.getElementById('nameContainer').style.display = 'none'; 
        }

        function saveHistory(studentName, testTitle, score, total, finalScore) {
            const history = JSON.parse(localStorage.getItem('pdfQuizHistory')) || [];
            const now = new Date();
            const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            history.unshift({ name: studentName, testTitle: testTitle, date: dateStr, score: score, total: total, finalScore: finalScore });
            localStorage.setItem('pdfQuizHistory', JSON.stringify(history));
            loadHistory();
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('pdfQuizHistory')) || [];
            if (history.length > 0) {
                document.getElementById('historyContainer').style.display = 'block';
                const historyArea = document.getElementById('historyArea');
                historyArea.innerHTML = '';
                
                history.slice(0, 5).forEach(record => {
                    historyArea.innerHTML += `
                        <div class="history-item">
                            <strong style="color:#2c3e50; font-size:1.1em;">👤 ${record.name}</strong> <span style="color:#7f8c8d; font-size:0.9em;">- ${record.testTitle}</span><br>
                            🗓️ ${record.date} - <strong style="color:#e74c3c; font-size:1.1em;">${record.finalScore}점</strong> (객관식 ${record.total}문항 중 ${record.score}정답)
                        </div>
                    `;
                });
            }
        }
    </script>
</body>
</html>
